<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pepper Burst 🌶️</title>
<style>
  :root {
    --bg: #0f0a08;
    --surface: #1a1008;
    --surface2: #241510;
    --border: #3a2010;
    --accent: #e8420a;
    --accent2: #f97316;
    --accent3: #fbbf24;
    --text: #f5e6d3;
    --text-muted: #a08060;
    --text-dim: #6b4a30;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }

  header {
    background: linear-gradient(135deg, #1a0803 0%, #2d0f05 50%, #1a0803 100%);
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 1rem; text-align: center; position: relative; z-index: 5;
  }
  .logo {
    font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #e8420a, #f97316, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    display: inline-block;
  }
  .back-link {
    position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); text-decoration: none; font-size: 0.8rem;
    padding: 0.3rem 0.6rem; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); transition: all 0.15s;
  }
  .back-link:hover { border-color: var(--accent2); color: var(--text); }

  /* HUD */
  .hud {
    display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap;
    padding: 0.55rem 0.75rem; background: var(--surface);
    border-bottom: 1px solid var(--border); z-index: 5;
  }
  .hud-box {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    padding: 0.3rem 0.8rem; text-align: center; min-width: 78px;
  }
  .hud-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .hud-value { font-weight: 800; font-size: 1.02rem; font-variant-numeric: tabular-nums; }
  #comboBox .hud-value { color: var(--accent3); }
  #comboBox.hot { animation: comboPulse 0.3s ease; }
  @keyframes comboPulse { 50% { transform: scale(1.15); } }
  #timeBox.low .hud-value { color: #ef4444; animation: blink 0.5s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  /* GAME AREA */
  #gameWrap { position: relative; flex: 1; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  /* OVERLAYS */
  .overlay {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(15, 10, 8, 0.86); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 1rem;
    overflow-y: auto;
  }
  .overlay.hidden { display: none; }
  .panel {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px;
    padding: 1.6rem 1.5rem; max-width: 420px; width: 100%; text-align: center;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .panel h1 { font-size: 1.9rem; font-weight: 900; margin-bottom: 0.2rem;
    background: linear-gradient(135deg, #e8420a, #f97316, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .panel .sub { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.1rem; }

  .legend { display: flex; flex-direction: column; gap: 0.35rem; margin: 0.9rem 0 1.2rem; text-align: left; }
  .legend-row {
    display: flex; align-items: center; gap: 0.6rem;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.38rem 0.65rem; font-size: 0.8rem;
  }
  .legend-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { font-weight: 700; flex: 1; }
  .legend-pts { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .big-btn {
    background: var(--accent); border: none; border-radius: 10px; color: white;
    font-size: 1.05rem; font-weight: 700; padding: 0.75rem 2.4rem; cursor: pointer;
    transition: background 0.15s, transform 0.1s; font-family: inherit;
  }
  .big-btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .big-btn:active { transform: translateY(1px); }

  .final-score { font-size: 3rem; font-weight: 900; color: var(--accent3); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .final-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
  .stats-row { display: flex; justify-content: center; gap: 0.6rem; margin: 1rem 0 1.3rem; }
  .stat-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 0.55rem 0.9rem; min-width: 90px; }
  .stat-box .hud-value { font-size: 1.1rem; }
  .new-best {
    display: inline-block; background: linear-gradient(135deg, #e8420a, #f97316);
    color: white; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em;
    padding: 0.25rem 0.7rem; border-radius: 20px; margin-bottom: 0.7rem;
    animation: comboPulse 0.6s ease infinite;
  }
  .hint { color: var(--text-dim); font-size: 0.72rem; font-style: italic; margin-top: 0.9rem; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="pepper-directory.html">← Directory</a>
  <div class="logo">🌶️ Pepper Burst</div>
</header>

<div class="hud">
  <div class="hud-box"><div class="hud-label">Score</div><div class="hud-value" id="scoreVal">0</div></div>
  <div class="hud-box" id="comboBox"><div class="hud-label">Combo</div><div class="hud-value" id="comboVal">×1</div></div>
  <div class="hud-box" id="timeBox"><div class="hud-label">Time</div><div class="hud-value" id="timeVal">60</div></div>
  <div class="hud-box"><div class="hud-label">Best</div><div class="hud-value" id="bestVal">0</div></div>
</div>

<div id="gameWrap">
  <canvas id="game"></canvas>

  <div class="overlay" id="startOverlay">
    <div class="panel">
      <h1>Pepper Burst</h1>
      <div class="sub">Pop the peppers before they float away!<br>Hotter peppers are worth more. Chain pops for combos.</div>
      <div class="legend" id="legendList"></div>
      <button class="big-btn" id="startBtn">Start Popping</button>
      <div class="hint">Tap or click the bubbles · 60 seconds per round</div>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="panel">
      <div id="newBestBadge" class="new-best" style="display:none">🔥 NEW BEST 🔥</div>
      <div class="final-label">Final Score</div>
      <div class="final-score" id="finalScore">0</div>
      <div class="stats-row">
        <div class="stat-box"><div class="hud-label">Popped</div><div class="hud-value" id="statPopped">0</div></div>
        <div class="stat-box"><div class="hud-label">Best Combo</div><div class="hud-value" id="statCombo">×1</div></div>
        <div class="stat-box"><div class="hud-label">Escaped</div><div class="hud-value" id="statEscaped">0</div></div>
      </div>
      <div class="sub" id="rankLine"></div>
      <button class="big-btn" id="againBtn">Play Again</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ─── PEPPER TIERS (colors match The Pepper Directory heat scale) ─────────────
const TIERS = [
  { key:'sweet',   name:'Bell Pepper',    color:'#4ade80', dark:'#15803d', pts:5,   weight:30, speed:0.85, size:1.15 },
  { key:'mild',    name:'Banana Pepper',  color:'#fbbf24', dark:'#b45309', pts:10,  weight:24, speed:0.95, size:1.05 },
  { key:'medium',  name:'Jalapeño',       color:'#fb923c', dark:'#c2410c', pts:20,  weight:20, speed:1.1,  size:1.0 },
  { key:'hot',     name:'Habanero',       color:'#ef4444', dark:'#991b1b', pts:40,  weight:14, speed:1.3,  size:0.9 },
  { key:'super',   name:'Ghost Pepper',   color:'#c026d3', dark:'#86198f', pts:80,  weight:8,  speed:1.55, size:0.8 },
  { key:'extreme', name:'Carolina Reaper',color:'#7c3aed', dark:'#4c1d95', pts:150, weight:4,  speed:1.85, size:0.72 },
];
const ROTTEN = { key:'rotten', name:'Rotten Pepper', color:'#78716c', dark:'#44403c', pts:-50, speed:0.75, size:1.05 };

const ROUND_SECONDS = 60;
const COMBO_WINDOW = 1100;  // ms between pops to keep the chain
const BASE_RADIUS = 34;

// ─── SETUP ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('gameWrap');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ─── SOUND (tiny WebAudio pops, no assets) ───────────────────────────────────
let audioCtx = null;
function sound(kind) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (kind === 'pop') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(500 + Math.random() * 300, t);
      osc.frequency.exponentialRampToValueAtTime(120, t + 0.09);
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.start(t); osc.stop(t + 0.11);
    } else if (kind === 'bad') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.28);
      gain.gain.setValueAtTime(0.14, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.31);
    } else if (kind === 'end') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(392, t);
      osc.frequency.setValueAtTime(523, t + 0.14);
      osc.frequency.setValueAtTime(659, t + 0.28);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      osc.start(t); osc.stop(t + 0.56);
    }
  } catch (e) { /* audio unavailable — game plays silently */ }
}

// ─── STATE ───────────────────────────────────────────────────────────────────
let bubbles = [], particles = [], floaters = [];
let score = 0, combo = 1, bestCombo = 1, popped = 0, escaped = 0;
let lastPopAt = 0, timeLeft = ROUND_SECONDS, spawnTimer = 0;
let running = false, lastFrame = 0;
let best = +(localStorage.getItem('pepperBurstBest') || 0);

const $ = id => document.getElementById(id);
$('bestVal').textContent = best;

// Legend on the start panel
$('legendList').innerHTML = TIERS.map(t =>
  `<div class="legend-row"><span class="legend-dot" style="background:${t.color}"></span>
   <span class="legend-name">${t.name}</span><span class="legend-pts">+${t.pts}</span></div>`
).join('') +
  `<div class="legend-row"><span class="legend-dot" style="background:${ROTTEN.color}"></span>
   <span class="legend-name">${ROTTEN.name} — avoid!</span><span class="legend-pts">${ROTTEN.pts} & breaks combo</span></div>`;

function pickTier() {
  const total = TIERS.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const t of TIERS) { r -= t.weight; if (r <= 0) return t; }
  return TIERS[0];
}

function spawnBubble() {
  const isRotten = Math.random() < 0.09;
  const tier = isRotten ? ROTTEN : pickTier();
  // Later in the round everything drifts a bit faster
  const urgency = 1 + (1 - timeLeft / ROUND_SECONDS) * 0.55;
  const r = BASE_RADIUS * tier.size * (0.9 + Math.random() * 0.25);
  bubbles.push({
    tier, isRotten,
    x: r + Math.random() * (W - r * 2),
    y: H + r + 10,
    r,
    vy: (0.55 + Math.random() * 0.35) * tier.speed * urgency,
    swayAmp: 12 + Math.random() * 22,
    swayFreq: 0.8 + Math.random() * 1.2,
    swayPhase: Math.random() * Math.PI * 2,
    rot: (Math.random() - 0.5) * 0.6,
    born: performance.now(),
    wobble: 0,
  });
}

// ─── DRAWING ─────────────────────────────────────────────────────────────────
function drawPepper(x, y, size, tier, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  const s = size / 34; // normalize to base radius
  ctx.scale(s, s);

  // body — curved chili tapering to a tip at the lower right
  ctx.beginPath();
  ctx.moveTo(-2, -15);
  ctx.bezierCurveTo(-11, -15, -14, -5, -10, 4);
  ctx.bezierCurveTo(-7, 11, 3, 17, 13, 20);
  ctx.bezierCurveTo(7, 12, 9, 3, 7, -6);
  ctx.bezierCurveTo(6, -12, 3, -15, -2, -15);
  ctx.closePath();
  const grad = ctx.createLinearGradient(-13, -14, 10, 18);
  grad.addColorStop(0, tier.color);
  grad.addColorStop(1, tier.dark);
  ctx.fillStyle = grad;
  ctx.fill();

  // highlight along the left flank
  ctx.beginPath();
  ctx.moveTo(-6, -11);
  ctx.bezierCurveTo(-10, -7, -10, 1, -6, 7);
  ctx.bezierCurveTo(-7, 0, -7, -6, -6, -11);
  ctx.closePath();
  ctx.lineWidth = 2.4;
  ctx.strokeStyle = 'rgba(255,255,255,0.32)';
  ctx.stroke();

  // stem
  ctx.beginPath();
  ctx.moveTo(-5, -13);
  ctx.quadraticCurveTo(-3, -17, 1, -14);
  ctx.quadraticCurveTo(2, -22, 6, -24);
  ctx.quadraticCurveTo(0, -23, -2, -19);
  ctx.quadraticCurveTo(-5, -18, -5, -13);
  ctx.closePath();
  ctx.fillStyle = '#4d7c0f';
  ctx.fill();

  // rotten peppers get sad spots
  if (tier.key === 'rotten') {
    ctx.fillStyle = 'rgba(30,25,20,0.55)';
    for (const [sx, sy, sr] of [[-6, 2, 3], [4, 8, 2.5], [1, -4, 2]]) {
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawBubble(b, now) {
  const sway = Math.sin(now / 1000 * b.swayFreq * Math.PI + b.swayPhase);
  const x = b.x + sway * b.swayAmp * 0.3;
  const squish = 1 + Math.sin(now / 130 + b.swayPhase) * 0.03 + b.wobble;

  ctx.save();
  ctx.translate(x, b.y);
  ctx.scale(squish, 2 - squish);

  // bubble shell
  const shell = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  shell.addColorStop(0, 'rgba(255,255,255,0.16)');
  shell.addColorStop(0.7, 'rgba(255,255,255,0.05)');
  shell.addColorStop(1, 'rgba(255,255,255,0.14)');
  ctx.beginPath();
  ctx.arc(0, 0, b.r, 0, Math.PI * 2);
  ctx.fillStyle = shell;
  ctx.fill();
  ctx.strokeStyle = b.isRotten ? 'rgba(120,113,108,0.5)' : `${b.tier.color}66`;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // glass glint
  ctx.beginPath();
  ctx.ellipse(-b.r * 0.4, -b.r * 0.45, b.r * 0.18, b.r * 0.1, -0.7, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fill();

  drawPepper(0, 2, b.r * 0.95, b.tier, b.rot + sway * 0.12);
  ctx.restore();
  b.drawX = x; // remember where it was actually drawn, for hit testing
}

function burst(b) {
  const n = 10 + Math.floor(b.r / 4);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1.5 + Math.random() * 4;
    particles.push({
      x: b.drawX, y: b.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      r: 2 + Math.random() * 4,
      color: Math.random() < 0.7 ? b.tier.color : b.tier.dark,
      life: 1,
    });
  }
  // bubble ring
  particles.push({ ring: true, x: b.drawX, y: b.y, r: b.r * 0.7, maxR: b.r * 1.9, color: b.tier.color, life: 1 });
}

function addFloater(x, y, text, color) {
  floaters.push({ x, y, text, color, life: 1 });
}

// ─── GAME LOOP ───────────────────────────────────────────────────────────────
function update(dt, now) {
  // spawn rate ramps up as time runs out
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnBubble();
    const progress = 1 - timeLeft / ROUND_SECONDS;
    spawnTimer = Math.max(0.28, 0.9 - progress * 0.5) * (0.7 + Math.random() * 0.6);
  }

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.vy * dt * 60;
    b.wobble *= 0.85;
    if (b.y < -b.r - 10) {
      bubbles.splice(i, 1);
      if (!b.isRotten) { escaped++; }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt * (p.ring ? 2.2 : 1.6);
    if (p.ring) { p.r += (p.maxR - p.r) * dt * 8; }
    else { p.x += p.vx; p.y += p.vy; p.vy += 0.12; }
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= dt * 45; f.life -= dt * 1.1;
    if (f.life <= 0) floaters.splice(i, 1);
  }

  // combo decays if you stop popping
  if (combo > 1 && now - lastPopAt > COMBO_WINDOW) {
    combo = 1;
    $('comboVal').textContent = '×1';
  }
}

function render(now) {
  ctx.clearRect(0, 0, W, H);

  // faint ember glow at the bottom
  const glow = ctx.createRadialGradient(W / 2, H + 60, 20, W / 2, H + 60, H * 0.7);
  glow.addColorStop(0, 'rgba(232,66,10,0.10)');
  glow.addColorStop(1, 'rgba(232,66,10,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  for (const b of bubbles) drawBubble(b, now);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.ring) {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.5; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color; ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = '800 17px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function frame(now) {
  if (!running) return;
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}

// round countdown
let timerId = null;
function tickTimer() {
  timeLeft--;
  $('timeVal').textContent = timeLeft;
  if (timeLeft <= 10) $('timeBox').classList.add('low');
  if (timeLeft <= 0) endGame();
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
function handleTap(cx, cy) {
  if (!running) return;
  const now = performance.now();
  // hit topmost bubble first (drawn last = on top)
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    const dx = cx - (b.drawX ?? b.x), dy = cy - b.y;
    if (dx * dx + dy * dy <= (b.r + 6) * (b.r + 6)) {
      bubbles.splice(i, 1);
      burst(b);
      if (b.isRotten) {
        score = Math.max(0, score + ROTTEN.pts);
        combo = 1;
        $('comboVal').textContent = '×1';
        addFloater(b.drawX, b.y, `${ROTTEN.pts} yuck!`, '#a8a29e');
        sound('bad');
      } else {
        if (now - lastPopAt <= COMBO_WINDOW) combo = Math.min(combo + 1, 8);
        else combo = 1;
        lastPopAt = now;
        bestCombo = Math.max(bestCombo, combo);
        const gained = b.tier.pts * combo;
        score += gained;
        popped++;
        addFloater(b.drawX, b.y, combo > 1 ? `+${gained} ×${combo}` : `+${gained}`, b.tier.color);
        $('comboVal').textContent = '×' + combo;
        if (combo > 1) {
          const box = $('comboBox');
          box.classList.remove('hot'); void box.offsetWidth; box.classList.add('hot');
        }
        sound('pop');
      }
      $('scoreVal').textContent = score;
      return;
    }
  }
  // miss — nearby bubbles wobble to taunt you
  for (const b of bubbles) {
    const dx = cx - (b.drawX ?? b.x), dy = cy - b.y;
    if (dx * dx + dy * dy < 120 * 120) b.wobble = 0.12;
  }
}

canvas.addEventListener('pointerdown', e => {
  const rect = canvas.getBoundingClientRect();
  handleTap(e.clientX - rect.left, e.clientY - rect.top);
});

// ─── ROUND FLOW ──────────────────────────────────────────────────────────────
function startGame() {
  bubbles = []; particles = []; floaters = [];
  score = 0; combo = 1; bestCombo = 1; popped = 0; escaped = 0;
  timeLeft = ROUND_SECONDS; spawnTimer = 0; lastPopAt = 0;
  $('scoreVal').textContent = '0';
  $('comboVal').textContent = '×1';
  $('timeVal').textContent = timeLeft;
  $('timeBox').classList.remove('low');
  $('startOverlay').classList.add('hidden');
  $('endOverlay').classList.add('hidden');
  running = true;
  lastFrame = performance.now();
  requestAnimationFrame(frame);
  clearInterval(timerId);
  timerId = setInterval(tickTimer, 1000);
}

function rankFor(s) {
  if (s >= 4000) return 'Carolina Reaper Champion 👑🌶️';
  if (s >= 2500) return 'Ghost Pepper Gladiator 👻';
  if (s >= 1500) return 'Habanero Hero 🔥';
  if (s >= 800)  return 'Jalapeño Journeyman 💪';
  if (s >= 300)  return 'Banana Pepper Beginner 🍌';
  return 'Mild Bell Pepper Rookie 🫑';
}

function endGame() {
  running = false;
  clearInterval(timerId);
  sound('end');
  const isBest = score > best;
  if (isBest) {
    best = score;
    localStorage.setItem('pepperBurstBest', best);
    $('bestVal').textContent = best;
  }
  $('newBestBadge').style.display = isBest ? 'inline-block' : 'none';
  $('finalScore').textContent = score;
  $('statPopped').textContent = popped;
  $('statCombo').textContent = '×' + bestCombo;
  $('statEscaped').textContent = escaped;
  $('rankLine').textContent = rankFor(score);
  $('endOverlay').classList.remove('hidden');
  requestAnimationFrame(idle);
}

$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);

// idle animation behind the start / game-over screens
function idle() {
  if (running) return;
  if (Math.random() < 0.03 && bubbles.length < 8) {
    timeLeft = ROUND_SECONDS; // keep urgency calm on the menu
    spawnBubble();
  }
  const now = performance.now();
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.vy;
    if (b.y < -b.r - 10) bubbles.splice(i, 1);
  }
  render(now);
  requestAnimationFrame(idle);
}
idle();
</script>
